# Builds a debug APK for PicWipe (Expo SDK 52 / React Native 0.76).
# Uses the committed android/ directory as-is — do NOT run `expo prebuild`
# (it would delete the custom native module SwipeCustomMediaModule).
name: Build debug APK

on:
  push:
    branches: [sadsha-remix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: picwipe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
